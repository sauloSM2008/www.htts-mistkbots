<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compartilhe para Acessar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
            overflow: hidden;
        }
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            padding: 20px;
            width: 90%;
            max-width: 500px; /* Aumenta o tamanho máximo da largura */
            position: relative;
        }
        .container h1 {
            color: #007BFF;
            margin-bottom: 20px;
        }
        .container p {
            font-size: 16px;
            margin-bottom: 20px;
        }
        .container button {
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
        }
        .container button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .progress {
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }
        .scroll-container {
            position: absolute;
            bottom: 0; /* Alinha a rolagem ao fundo da div */
            left: 0;
            right: 0;
            height: 40px;
            overflow: hidden;
        }
        .scroll-content {
            display: flex;
            flex-direction: column;
            font-size: 14px;
            color: #007BFF;
            font-weight: bold;
            
            white-space: nowrap;
            animation: scrollUp 20s linear infinite; /* Ajusta a duração para uma rolagem contínua e suave */
        }
        @keyframes scrollUp {
            0% { transform: translateY(100%); }
            100% { transform: translateY(-100%); }
        }
        .image-container {
            margin-bottom: 20px;
        }
        .image-container img {
            width: 100%;
            height: 150px;
            max-width: 400px; /* Define o tamanho máximo da imagem */
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
        }
        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 10px; /* Espaço entre os botões */
            margin-top: 20px;
        }
        .buttons-container a {
            text-decoration: none;
        }
        .button {
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            display: inline-block;
            text-align: center;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #218838;
        }
        .button.secondary {
            background-color: #dc3545;
        }
        .button.secondary:hover {
            background-color: #c82333;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="image-container">
            <img src="ta.png" alt="Imagem Atraente"> <!-- Substitua o link da imagem pela URL da imagem desejada -->
        </div>
        <h1>Revindique seu Dinheiro</h1>
        <p>Compartilhe este link em 5 grupos e 10 pessoas para revendicar o seu dinheiro.</p>
        <button id="shareBtn" onclick="shareLink()">Compartilhar Agora</button>
        <p class="progress" id="progressText">0 de 15 compartilhamentos</p>
        <a href="https://gulo.me/Revendique_seu_dinheiro" id="link" class="hidden">Clique aqui para acessar o link</a>
        <div class="scroll-container">
            <div class="scroll-content" id="scrollContent"></div>
        </div>
        <div id="buttons" class="hidden buttons-container">
            <a href="https://track.africabetpartners.com/visit/?bta=36968&nci=6280" target="_blank" class="button">Revendicar</a>
            <a href="https://media.888africa.com/C.ashx?btag=a_4176b_437c_&affid=3450&siteid=4176&adid=437&c=" target="_blank" class="button secondary">Revendicar</a>
        </div>
    </div>

    <script>
        let shares = 0;
        const requiredShares = 15;

        function shareLink() {
            const shareMessage = "Revendique já o seu dinheiro por direito corra agora clique aqui👇 https://gulo.me/revendique_seu_dinheiro_ja";
            const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(shareMessage)}`;

            window.open(whatsappUrl, '_blank');

            // Adiciona um atraso de 1 segundo antes de atualizar o contador de compartilhamentos
            setTimeout(() => {
                shares++;
                document.getElementById('progressText').innerText = `${shares} de ${requiredShares} compartilhamentos`;

                if (shares >= requiredShares) {
                    document.getElementById('link').style.display = 'none';
                    document.getElementById('shareBtn').disabled = true;
                    document.getElementById('progressText').innerText = "Compartilhamento completo! Você pode acessar o link.";
                    document.getElementById('buttons').classList.remove('hidden');
                }
            }, 1000); // 1000 milissegundos = 1 segundo
        }

        function getRandomPhoneNumber() {
            const prefixes = ['84', '85'];
            const prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
            let number = prefix + Math.floor(Math.random() * 10000000).toString().padStart(7, '0');
            const indices = [];
            while (indices.length < 3) {
                const randIndex = Math.floor(Math.random() * 7) + 2; // Evita os dois primeiros dígitos
                if (!indices.includes(randIndex)) {
                    indices.push(randIndex);
                }
            }
            indices.forEach(index => {
                number = number.substring(0, index) + '*' + number.substring(index + 1);
            });
            const amount = Math.floor(Math.random() * 9000) + 1000; // Valor sacado aleatório entre 1000 e 9999
            return `${number} sacou ${amount}MT`;
        }

        function generateScrollingContent() {
            const scrollContent = document.getElementById('scrollContent');
            for (let i = 0; i < 10; i++) { // Gera 10 números aleatórios imediatamente ao carregar a página
                const phoneNumber = getRandomPhoneNumber();
                const pElement = document.createElement("p");
                pElement.textContent = phoneNumber;
                scrollContent.appendChild(pElement);
            }
            setInterval(() => {
                for (let i = 0; i < 10; i++) { // Continua gerando 10 números a cada 30 segundos
                    const phoneNumber = getRandomPhoneNumber();
                    const pElement = document.createElement("p");
                    pElement.textContent = phoneNumber;
                    scrollContent.appendChild(pElement);
                }
            }, 30000); // Adiciona novos números a cada 30 segundos
        }

        generateScrollingContent(); // Inicia a rolagem ao carregar a página
    </script>
</body>
</html>
